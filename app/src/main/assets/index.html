<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ሰንበት ትምህርት ቤት</title>

<style>
:root {
    --green: #167a45;
    --blue: #1769aa;
    --red: #b42318;
    --bg: #f4f7f5;
    --line: #d8e2dc;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: #182522;
    font-family: Arial, sans-serif;
    font-size: 15px;
}

header {
    background: var(--green);
    color: white;
    padding: 18px 12px;
    text-align: center;
}

header h1 {
    margin: 0 0 6px;
}

nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    padding: 10px;
    background: white;
}

button {
    border: 0;
    border-radius: 7px;
    padding: 10px 13px;
    background: var(--green);
    color: white;
    font-weight: bold;
    cursor: pointer;
}

nav button {
    background: #e8f1eb;
    color: #174d32;
}

nav button.active {
    background: var(--green);
    color: white;
}

main {
    max-width: 1100px;
    margin: auto;
    padding: 12px;
}

.panel {
    background: white;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
}

h2 {
    color: var(--green);
    font-size: 20px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 10px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
}

input, select {
    width: 100%;
    padding: 10px;
    border: 1px solid #bac9c0;
    border-radius: 7px;
    background: white;
    font-size: 16px;
}

.row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

th, td {
    padding: 8px;
    border: 1px solid var(--line);
    text-align: left;
}

th {
    background: #edf4ef;
}

.table-wrap {
    overflow-x: auto;
}

.P { color: green; }
.A { color: #c62828; }
.L { color: #1769aa; }
.E { color: #8657a8; }

.hidden {
    display: none !important;
}

.small {
    font-size: 13px;
    color: #53635b;
}

.notice {
    background: #fff7dc;
    padding: 10px;
    border-radius: 7px;
    margin: 10px 0;
}

.danger {
    background: var(--red);
}

.secondary {
    background: var(--blue);
}

.light {
    background: #e8f1eb;
    color: #174d32;
}

.stat {
    padding: 12px;
    background: #edf5ef;
    border-radius: 8px;
    text-align: center;
}

.stat b {
    display: block;
    font-size: 24px;
    color: var(--green);
}

@media print {
    nav, .no-print, button {
        display: none !important;
    }

    body {
        background: white;
        font-size: 12px;
    }

    main {
        max-width: none;
        padding: 0;
    }

    .panel {
        border: 0;
    }
}
</style>
</head>

<body>

<header>
    <h1>ሰንበት ትምህርት ቤት</h1>
    <p>የተማሪ መዝገብ • የቀረቤታ መዝገብ • ሪፖርት</p>
</header>

<nav class="no-print">
    <button class="active" data-page="attendance">ቀረቤታ</button>
    <button data-page="students">ተማሪዎች</button>
    <button data-page="classes">ክፍሎች</button>
    <button data-page="reports">ሪፖርት</button>
    <button data-page="backup">Backup / Restore</button>
</nav>

<main>

<!-- ATTENDANCE -->
<section id="attendance" class="page">
<div class="panel">

<h2>የቀረቤታ መዝገብ</h2>

<div class="grid">
    <div>
        <label>ቀን (የኢትዮጵያ ዘመን)</label>
        <input id="attDate" placeholder="01/02/2019">
        <div class="small">ቅርጽ፦ ቀን/ወር/ዓመት</div>
    </div>

    <div>
        <label>ክፍል</label>
        <select id="attClass"></select>
    </div>
</div>

<div class="row">
    <button id="loadAtt">ተማሪዎችን አሳይ</button>
    <button id="saveAtt">ቀረቤታ አስቀምጥ</button>
    <button class="light" id="allPresent">ሁሉንም P አድርግ</button>
</div>

<div class="notice">
    P = ተገኝቷል |
    A = ቀርቷል |
    L = ዘግይቷል |
    E = ፈቃድ
</div>

<div id="attendanceTable" class="table-wrap"></div>

</div>
</section>

<!-- STUDENTS -->
<section id="students" class="page hidden">
<div class="panel">

<h2>ተማሪ መመዝገብ</h2>

<div class="grid">
    <div>
        <label>ሙሉ ስም</label>
        <input id="studentName" placeholder="የተማሪው ስም">
    </div>

    <div>
        <label>ክፍል</label>
        <select id="studentClass"></select>
    </div>

    <div>
        <label>ስልክ (አማራጭ)</label>
        <input id="studentPhone" placeholder="09...">
    </div>
</div>

<div class="row">
    <button id="addStudent">ተማሪ ጨምር</button>
</div>

<div id="studentsTable" class="table-wrap"></div>

</div>
</section>

<!-- CLASSES -->
<section id="classes" class="page hidden">
<div class="panel">

<h2>የክፍል አያያዝ</h2>

<label>የክፍል ስም</label>
<input id="className" placeholder="ለምሳሌ አንደኛ ክፍል">

<div class="row">
    <button id="addClass">ክፍል ጨምር</button>
</div>

<div id="classesTable" class="table-wrap"></div>

</div>
</section>

<!-- REPORTS -->
<section id="reports" class="page hidden">
<div class="panel">

<h2>የቀን ክልል ሪፖርት</h2>

<div class="grid">
    <div>
        <label>ከ (የኢትዮጵያ ቀን)</label>
        <input id="fromDate" placeholder="01/01/2019">
    </div>

    <div>
        <label>እስከ (የኢትዮጵያ ቀን)</label>
        <input id="toDate" placeholder="30/13/2019">
    </div>

    <div>
        <label>ተማሪ</label>
        <select id="reportStudent"></select>
    </div>
</div>

<div class="row">
    <button id="makeReport">ሪፖርት አውጣ</button>
    <button class="secondary" id="printReport">Print / PDF</button>
    <button class="light" id="csvReport">CSV አውርድ</button>
</div>

<div id="reportResult"></div>

</div>
</section>

<!-- BACKUP -->
<section id="backup" class="page hidden">
<div class="panel">

<h2>Backup / Restore</h2>

<p>
የተማሪዎችንና የቀረቤታ መረጃዎችን ለማስቀመጥ Backup ያውርዱ።
</p>

<div class="row">
    <button id="backupBtn">Backup አውርድ</button>

    <label class="btn secondary" for="restoreFile">
        Restore ፋይል ምረጥ
    </label>

    <input class="hidden" id="restoreFile"
           type="file" accept=".json,application/json">
</div>

<div id="backupMessage"></div>

</div>

<div class="panel">
<h2>የይለፍ ቃል</h2>

<label>አዲስ የይለፍ ቃል</label>
<input id="newPassword" type="password"
       placeholder="ቢያንስ 4 ቁምፊ">

<div class="row">
    <button id="setPassword">የይለፍ ቃል አስቀምጥ</button>
    <button id="lockNow" class="danger">መተግበሪያውን ቆልፍ</button>
</div>
</div>
</section>

</main>

<div id="lockScreen" class="hidden"
     style="position:fixed;inset:0;background:#f4f7f5;z-index:10;align-items:center;justify-content:center;padding:20px">

<div class="panel" style="width:min(400px,100%)">
    <h2>መተግበሪያው ተቆልፏል</h2>
    <label>የይለፍ ቃል</label>
    <input id="unlockPassword" type="password">

    <div class="row">
        <button id="unlockBtn">ክፈት</button>
    </div>

    <p id="unlockMessage"></p>
</div>
</div>

<script>
(function () {
"use strict";

/*
  አስፈላጊ፦
  እነዚህ የቀድሞው መተግበሪያ የመረጃ ቁልፎች ናቸው።
  እንዳይጠፋ በተመሳሳይ ስም ተጠቅመናል።
*/
const K = {
    students: "ss_students",
    attendance: "ss_attendance",
    classes: "ss_classes",
    password: "ss_admin_password_hash"
};

const $ = id => document.getElementById(id);

function read(key, fallback) {
    try {
        const value = localStorage.getItem(key);
        return value ? JSON.parse(value) : fallback;
    } catch (e) {
        return fallback;
    }
}

function write(key, value) {
    localStorage.setItem(key, JSON.stringify(value));
}

let students = read(K.students, []);
let attendance = read(K.attendance, {});
let classes = read(K.classes, []);

if (!Array.isArray(students)) students = [];
if (!attendance || typeof attendance !== "object") attendance = {};
if (!Array.isArray(classes)) classes = [];

if (classes.length === 0) {
    classes = ["አጠቃላይ"];
    write(K.classes, classes);
}

const statusLabels = {
    P: "ተገኝቷል",
    A: "ቀርቷል",
    L: "ዘግይቷል",
    E: "ፈቃድ"
};

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function saveAll() {
    write(K.students, students);
    write(K.attendance, attendance);
    write(K.classes, classes);
}

/*
  የኢትዮጵያ ዘመን ለማንበብ Intl API ይጠቀማል።
  የቀድሞ የቀረቤታ ቁልፎች ግን Gregorian ISO ቀኖች
  (YYYY-MM-DD) ሆነው ይቀመጣሉ።
*/
function ethiopianParts(date) {
    try {
        const formatter = new Intl.DateTimeFormat(
            "en-u-ca-ethiopic",
            {
                day: "numeric",
                month: "numeric",
                year: "numeric",
                timeZone: "UTC"
            }
        );

        const parts = {};

        formatter.formatToParts(date).forEach(part => {
            if (part.type !== "literal") {
                parts[part.type] = Number(part.value);
            }
        });

        return {
            d: parts.day,
            m: parts.month,
            y: parts.year
        };
    } catch (error) {
        return null;
    }
}

function toISO(input) {
    const match = String(input || "").trim().match(
        /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/
    );

    if (!match) return null;

    const day = Number(match[1]);
    const month = Number(match[2]);
    const year = Number(match[3]);

    if (
        day < 1 || day > 30 ||
        month < 1 || month > 13 ||
        year < 1
    ) {
        return null;
    }

    /*
      በተሰጠው የኢትዮጵያ ቀን የሚዛመደውን
      Gregorian ቀን ይፈልጋል።
    */
    const start = Date.UTC(year + 7, 7, 25);
    const end = Date.UTC(year + 8, 9, 10);

    for (let time = start; time <= end; time += 86400000) {
        const parts = ethiopianParts(new Date(time));

        if (
            parts &&
            parts.y === year &&
            parts.m === month &&
            parts.d === day
        ) {
            return new Date(time).toISOString().slice(0, 10);
        }
    }

    return null;
}

function etDate(iso) {
    if (!iso) return "";

    const [year, month, day] = iso.split("-").map(Number);

    const parts = ethiopianParts(
        new Date(Date.UTC(year, month - 1, day))
    );

    if (!parts) return iso;

    return (
        String(parts.d).padStart(2, "0") + "/" +
        String(parts.m).padStart(2, "0") + "/" +
        parts.y
    );
}

function todayEt() {
    return etDate(new Date().toISOString().slice(0, 10));
}

function fillClassSelects() {
    $("attClass").innerHTML =
        '<option value="__ALL__">ሁሉም ክፍሎች</option>' +
        classes.map(c =>
            `<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`
        ).join("");

    $("studentClass").innerHTML = classes.map(c =>
        `<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`
    ).join("");
}

function fillReportStudents() {
    $("reportStudent").innerHTML =
        '<option value="__ALL__">ሁሉም ተማሪዎች</option>' +
        students.map(s =>
            `<option value="${escapeHTML(s.id)}">${escapeHTML(s.name)}</option>`
        ).join("");
}

function showStudents() {
    $("studentsTable").innerHTML =
        `<table>
        <thead>
            <tr>
                <th>#</th>
                <th>ሙሉ ስም</th>
                <th>ክፍል</th>
                <th>ስልክ</th>
                <th class="no-print">ሰርዝ</th>
            </tr>
        </thead>
        <tbody>` +
        students.map((s, i) => `
            <tr>
                <td>${i + 1}</td>
                <td>${escapeHTML(s.name)}</td>
                <td>${escapeHTML(s.className || "")}</td>
                <td>${escapeHTML(s.phone || "")}</td>
                <td class="no-print">
                    <button class="danger"
                        data-del-student="${escapeHTML(s.id)}">
                        ሰርዝ
                    </button>
                </td>
            </tr>
        `).join("") +
        `</tbody></table>`;

    fillReportStudents();
}

function showClasses() {
    $("classesTable").innerHTML =
        `<table>
        <thead>
            <tr>
                <th>የክፍል ስም</th>
                <th>ተማሪዎች</th>
                <th>ሰርዝ</th>
            </tr>
        </thead>
        <tbody>` +
        classes.map(c => `
            <tr>
                <td>${escapeHTML(c)}</td>
                <td>${students.filter(s => s.className === c).length}</td>
                <td>
                    <button class="danger"
                        data-del-class="${escapeHTML(c)}">
                        ሰርዝ
                    </button>
                </td>
            </tr>
        `).join("") +
        `</tbody></table>`;
}

function drawAttendance() {
    const iso = toISO($("attDate").value);

    if (!iso) {
        $("attendanceTable").innerHTML =
            '<p class="small">ትክክለኛ የኢትዮጵያ ቀን ያስገቡ።</p>';
        return;
    }

    const selectedClass = $("attClass").value;

    const list = students.filter(s =>
        selectedClass === "__ALL__" ||
        s.className === selectedClass
    );

    const day = attendance[iso] || {};

    $("attendanceTable").innerHTML =
        `<p><b>ቀን፦ ${etDate(iso)}</b> | ተማሪዎች፦ ${list.length}</p>
        <table>
        <thead>
            <tr>
                <th>#</th>
                <th>ሙሉ ስም</th>
                <th>ክፍል</th>
                <th>P</th>
                <th>A</th>
                <th>L</th>
                <th>E</th>
            </tr>
        </thead>
        <tbody>` +
        list.map((s, i) => `
            <tr>
                <td>${i + 1}</td>
                <td>${escapeHTML(s.name)}</td>
                <td>${escapeHTML(s.className || "")}</td>
                ${["P", "A", "L", "E"].map(status => `
                    <td class="${status}">
                        <input
                            type="radio"
                            aria-label="${escapeHTML(s.name)} ${status}"
                            name="status-${escapeHTML(s.id)}"
                            value="${status}"
                            ${day[s.id] === status ? "checked" : ""}
                        >
                    </td>
                `).join("")}
            </tr>
        `).join("") +
        `</tbody></table>`;
}

function makeReport() {
    const from = toISO($("fromDate").value);
    const to = toISO($("toDate").value);

    if (!from || !to || from > to) {
        $("reportResult").innerHTML =
            '<p class="notice">ትክክለኛ የመጀመሪያና የመጨረሻ ቀን ያስገቡ።</p>';
        return;
    }

    const dates = Object.keys(attendance)
        .filter(date =>
            date >= from &&
            date <= to &&
            attendance[date] &&
            Object.keys(attendance[date]).length > 0
        )
        .sort();

    const studentId = $("reportStudent").value;

    const list = students.filter(s =>
        studentId === "__ALL__" ||
        String(s.id) === studentId
    );

    let html = `
        <div class="grid">
            <div class="stat">
                <b>${dates.length}</b>
                ቀረቤታ የተመዘገበባቸው ቀናት
            </div>
            <div class="stat">
                <b>${list.length}</b>
                ተማሪዎች
            </div>
        </div>

        <p>
            ከ ${etDate(from)} እስከ ${etDate(to)}
        </p>

        <div class="table-wrap">
        <table>
        <thead>
            <tr>
                <th>ተማሪ</th>
                <th>ክፍል</th>
                <th>P</th>
                <th>A</th>
                <th>L</th>
                <th>E</th>
                <th>ተሳትፎ %</th>
            </tr>
        </thead>
        <tbody>`;

    const csvRows = [
        [
            "Name",
            "Class",
            "Present",
            "Absent",
            "Late",
            "Permission",
            "Participation %"
        ]
    ];

    list.forEach(student => {
        const counts = { P: 0, A: 0, L: 0, E: 0 };

        dates.forEach(date => {
            const status = attendance[date]?.[student.id];

            if (counts[status] !== undefined) {
                counts[status]++;
            }
        });

        const total = Object.values(counts)
            .reduce((sum, count) => sum + count, 0);

        const percentage = total
            ? Math.round((counts.P + counts.L) / total * 100)
            : 0;

        html += `
            <tr>
                <td>${escapeHTML(student.name)}</td>
                <td>${escapeHTML(student.className || "")}</td>
                <td>${counts.P}</td>
                <td>${counts.A}</td>
                <td>${counts.L}</td>
                <td>${counts.E}</td>
                <td>${percentage}%</td>
            </tr>`;

        csvRows.push([
            student.name,
            student.className || "",
            counts.P,
            counts.A,
            counts.L,
            counts.E,
            percentage
        ]);
    });

    html += "</tbody></table></div>";

    if (studentId !== "__ALL__" && list.length) {
        const student = list[0];

        html += `
            <h3>የዕለት ዝርዝር፦ ${escapeHTML(student.name)}</h3>
            <div class="table-wrap">
            <table>
            <thead>
                <tr>
                    <th>ቀን (ኢትዮጵያ)</th>
                    <th>ሁኔታ</th>
                </tr>
            </thead>
            <tbody>`;

        dates.forEach(date => {
            const status = attendance[date]?.[student.id];

            html += `
                <tr>
                    <td>${etDate(date)}</td>
                    <td class="${escapeHTML(status || "")}">
                        ${status
                            ? status + " - " + statusLabels[status]
                            : "አልተመዘገበም"}
                    </td>
                </tr>`;
        });

        html += "</tbody></table></div>";
    }

    $("reportResult").innerHTML = html;
    window.lastReportCSV = csvRows;
}

/* የገጽ ማስተላለፊያ */
document.querySelectorAll("nav button").forEach(button => {
    button.addEventListener("click", () => {
        document.querySelectorAll("nav button")
            .forEach(b => b.classList.remove("active"));

        button.classList.add("active");

        document.querySelectorAll(".page")
            .forEach(page => page.classList.add("hidden"));

        $(button.dataset.page).classList.remove("hidden");

        if (button.dataset.page === "students") showStudents();
        if (button.dataset.page === "classes") showClasses();
        if (button.dataset.page === "reports") fillReportStudents();
    });
});
