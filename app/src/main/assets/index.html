<!doctype html>
<html lang="am"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ሰንበት ትምህርት ቤት - Attendance</title>
<style>
:root{--g:#167a45;--b:#1769aa;--r:#b42318;--bg:#f4f7f5;--line:#d8e2dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Arial,"Noto Sans Ethiopic",sans-serif;color:#182522}header{background:var(--g);color:white;text-align:center;padding:18px}h1{margin:0 0 6px;font-size:23px}nav{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;background:white;padding:10px;position:sticky;top:0}button,.btn{border:0;border-radius:8px;padding:10px 13px;background:var(--g);color:white;font-weight:bold;cursor:pointer}button:disabled{opacity:.6}nav button{background:#e8f1eb;color:#174d32}nav button.active{background:var(--g);color:white}main{max-width:1100px;margin:auto;padding:14px}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:14px}h2{font-size:19px;margin:0 0 12px;color:var(--g)}label{display:block;font-weight:bold;margin:8px 0 5px}input,select{width:100%;padding:10px;border:1px solid #bac9c0;border-radius:7px;font-size:16px;background:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:9px;border:1px solid var(--line);text-align:left}th{background:#edf4ef}.hidden{display:none!important}.notice{padding:10px;border-radius:8px;background:#fff7dc;margin:10px 0}.small{font-size:13px;color:#53635b}.P{color:#16803d}.A{color:#c62828}.L{color:#1769aa}.E{color:#8657a8}.status{text-align:center}.stat{padding:12px;background:#edf5ef;border-radius:9px;text-align:center}.stat b{display:block;font-size:24px;color:var(--g)}@media print{nav,.no-print,button{display:none!important}body{background:white}header{background:white;color:black}.panel{border:0}}
</style></head><body>
<header><h1>ሰንበት ትምህርት ቤት</h1><p>የተማሪ መዝገብ • ቀረቤታ • ሪፖርት</p></header>
<nav class="no-print"><button class="active" data-page="attendance">ቀረቤታ</button><button data-page="students">ተማሪዎች</button><button data-page="classes">ክፍሎች</button><button data-page="reports">ሪፖርት</button><button data-page="backup">Backup</button></nav>
<main>
<section id="attendance" class="page"><div class="panel"><h2>የቀረቤታ መዝገብ</h2><div class="grid"><div><label>ቀን (DD/MM/YYYY የኢትዮጵያ ዘመን)</label><input id="attDate" placeholder="01/02/2019"></div><div><label>ክፍል</label><select id="attClass"></select></div></div><div class="row"><button id="loadAtt">ተማሪዎችን አሳይ</button><button id="saveAtt">ቀረቤታ አስቀምጥ</button><button id="allPresent">ሁሉንም P አድርግ</button></div><p class="notice">P = ተገኝቷል • A = ቀርቷል • L = ዘግይቷል • E = ፈቃድ</p><div id="attendanceTable" class="table-wrap"></div></div></section>
<section id="students" class="page hidden"><div class="panel"><h2>ተማሪ መመዝገብ</h2><label>ተማሪ ፈልግ</label><input id="studentSearch" placeholder="ስም ወይም ስልክ"><div class="grid"><div><label>ሙሉ ስም</label><input id="studentName"></div><div><label>ክፍል</label><select id="studentClass"></select></div><div><label>ስልክ (አማራጭ)</label><input id="studentPhone"></div></div><div class="row"><button id="addStudent">ተማሪ ጨምር</button></div><div id="studentsTable" class="table-wrap"></div></div></section>
<section id="classes" class="page hidden"><div class="panel"><h2>ክፍሎች</h2><label>የክፍል ስም</label><input id="className"><div class="row"><button id="addClass">ክፍል ጨምር</button></div><div id="classesTable" class="table-wrap"></div></div></section>
<section id="reports" class="page hidden"><div class="panel"><h2>የቀረቤታ ሪፖርት</h2><div class="grid"><div><label>ከ (DD/MM/YYYY)</label><input id="fromDate"></div><div><label>እስከ (DD/MM/YYYY)</label><input id="toDate"></div><div><label>ተማሪ</label><select id="reportStudent"></select></div></div><div class="row"><button id="makeReport">ሪፖርት አውጣ</button><button id="printReport">Print / PDF</button></div><div id="statistics"></div><div id="reportResult" class="table-wrap"></div></div></section>
<section id="backup" class="page hidden"><div class="panel"><h2>Backup / Restore</h2><button id="backupBtn">Backup አውርድ</button><label class="btn" for="restoreFile">Restore ፋይል ምረጥ</label><input id="restoreFile" type="file" accept=".json" class="hidden"><p id="backupMessage"></p></div></section>
</main>
<div id="cloudLogin" style="position:fixed;inset:0;background:#f4f7f5;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto"><div class="panel" style="width:min(430px,100%)"><h2>🔐 የሰራተኛ መግቢያ</h2><p class="small">የSupervisor ወይም Teacher Firebase መለያ ይጠቀሙ።</p><label>Email</label><input id="cloudEmail" type="email" autocomplete="username"><label>Password</label><input id="cloudPassword" type="password" autocomplete="current-password"><div class="row"><button id="cloudLoginBtn" type="button">ግባ / Sign in</button><button id="cloudSignupBtn" type="button">መለያ ፍጠር / Sign up</button><button id="cloudLogoutBtn" class="hidden" type="button">ውጣ / Sign out</button></div><p id="cloudLoginMessage" class="notice" aria-live="polite">Email እና Password ያስገቡ።</p></div></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(function(){
'use strict';
/* IMPORTANT FIX: define $ before it is used by the login listeners. */
const $=id=>document.getElementById(id);
const cfg={apiKey:'AIzaSyCNi9XeY7lpu_swv_3Kqbh1kRaziupQTxc',authDomain:'sundayschoolattendance-932d4.firebaseapp.com',projectId:'sundayschoolattendance-932d4',storageBucket:'sundayschoolattendance-932d4.firebasestorage.app',messagingSenderId:'555888361635',appId:'1:555888361635:web:f2858fe235299677257f16',measurementId:'G-L7CCVY14F4'};
firebase.initializeApp(cfg);const auth=firebase.auth(),db=firebase.firestore();
let currentUser=null,role=null,students=[],classes=['አጠቃላይ'],attendance={};
const labels={P:'ተገኝቷል',A:'ቀርቷል',L:'ዘግይቷል',E:'ፈቃድ'};
const msg=t=>$('cloudLoginMessage').textContent=t;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setLogin(show){$('cloudLogin').style.display=show?'flex':'none';$('cloudLogoutBtn').classList.toggle('hidden',!currentUser)}
function dateISO(s){let m=String(s||'').trim().match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);if(!m)return null;let d=+m[1],mo=+m[2],y=+m[3];if(d<1||d>30||mo<1||mo>13||y<1)return null;try{let f=new Intl.DateTimeFormat('en-u-ca-ethiopic',{day:'numeric',month:'numeric',year:'numeric',timeZone:'UTC'});let start=Date.UTC(y+7,7,25),end=Date.UTC(y+8,9,10);for(let t=start;t<=end;t+=86400000){let p={};f.formatToParts(new Date(t)).forEach(x=>{if(x.type!=='literal')p[x.type]=+x.value});if(p.year===y&&p.month===mo&&p.day===d)return new Date(t).toISOString().slice(0,10)}}catch(e){}return null}
function dateET(iso){if(!iso)return '';let a=iso.split('-').map(Number);try{let p={};new Intl.DateTimeFormat('en-u-ca-ethiopic',{day:'numeric',month:'numeric',year:'numeric',timeZone:'UTC'}).formatToParts(new Date(Date.UTC(a[0],a[1]-1,a[2]))).forEach(x=>{if(x.type!=='literal')p[x.type]=+x.value});return String(p.day).padStart(2,'0')+'/'+String(p.month).padStart(2,'0')+'/'+p.year}catch(e){return iso}}
function today(){return dateET(new Date().toISOString().slice(0,10))}
function saveLocal(){try{localStorage.setItem('ss_students',JSON.stringify(students));localStorage.setItem('ss_classes',JSON.stringify(classes));localStorage.setItem('ss_attendance',JSON.stringify(attendance))}catch(e){}}
async function cloudSave(){if(!currentUser)return;try{let batch=db.batch();students.forEach(s=>batch.set(db.collection('students').doc(String(s.id)),{...s,id:String(s.id)}));classes.forEach(c=>batch.set(db.collection('classes').doc(encodeURIComponent(c)),{name:c}));Object.keys(attendance).forEach(date=>Object.keys(attendance[date]||{}).forEach(id=>{let status=attendance[date][id];if(['P','A','L','E'].includes(status))batch.set(db.collection('attendance').doc(encodeURIComponent(date+'_'+id)),{date,studentId:String(id),status,updatedBy:currentUser.uid,updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}));await batch.commit()}catch(e){console.error(e);alert('Firebase ላይ ማስቀመጥ አልተሳካም: '+e.message)}}
async function login(){let email=$('cloudEmail').value.trim(),password=$('cloudPassword').value;if(!email||!password){msg('Email እና Password ያስገቡ።');return}$('cloudLoginBtn').disabled=true;msg('በመግባት ላይ...');try{let cred=await auth.signInWithEmailAndPassword(email,password);currentUser=cred.user;let ud=await db.collection('users').doc(currentUser.uid).get();if(!ud.exists||!['supervisor','teacher'].includes(ud.data().role)){await auth.signOut();currentUser=null;role=null;msg('የመለያው role አልተገኘም። Firestore users/'+cred.user.uid+' ውስጥ role=supervisor ወይም teacher መሆኑን ይፈትሹ።');return}role=ud.data().role;await loadCloud();setLogin(false);$('cloudPassword').value='';msg('ገብተዋል።')}catch(e){console.error(e);msg('ስህተት: '+(e.message||'Firebase ግንኙነት አልተሳካም።'))}finally{$('cloudLoginBtn').disabled=false}}
async function loadCloud(){let [ss,cc,aa]=await Promise.all([db.collection('students').get(),db.collection('classes').get(),db.collection('attendance').get()]);students=ss.docs.map(d=>({...d.data(),id:String(d.data().id||d.id)}));classes=cc.docs.map(d=>d.data().name||d.id);if(!classes.length)classes=['አጠቃላይ'];attendance={};aa.docs.forEach(d=>{let x=d.data();if(x.date&&x.studentId&&labels[x.status]){attendance[x.date]=attendance[x.date]||{};attendance[x.date][x.studentId]=x.status}});saveLocal();renderAll()}
async function signup(){
 let email=$('cloudEmail').value.trim(), password=$('cloudPassword').value;
 if(!email||!password){msg('Email እና Password ያስገቡ።');return}
 if(password.length<6){msg('Password ቢያንስ 6 ፊደል/ቁጥር መሆን አለበት።');return}
 $('cloudSignupBtn').disabled=true; msg('መለያ በመፍጠር ላይ...');
 try{
   const cred=await auth.createUserWithEmailAndPassword(email,password);
   await db.collection('users').doc(cred.user.uid).set({email:email,role:'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
   await auth.signOut();
   msg('መለያ ተፈጥሯል። አሁን Supervisor በFirestore users/'+cred.user.uid+' ውስጥ role ወደ teacher ወይም supervisor እስኪቀይር ድረስ Sign in አይሰራም።');
 }catch(e){console.error(e);msg('Signup ስህተት: '+(e.message||'መለያ መፍጠር አልተሳካም።'))}
 finally{$('cloudSignupBtn').disabled=false}
}
$('cloudSignupBtn').addEventListener('click',signup);
$('cloudLoginBtn').addEventListener('click',login);$('cloudPassword').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('cloudEmail').addEventListener('keydown',e=>{if(e.key==='Enter')$('cloudPassword').focus()});
$('cloudLogoutBtn').addEventListener('click',async()=>{await auth.signOut();currentUser=null;role=null;setLogin(true);msg('ወጥተዋል። እንደገና ይግቡ።')});
function fillSelects(){let opts=classes.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');$('studentClass').innerHTML=opts;$('attClass').innerHTML='<option value="__ALL__">ሁሉም ክፍሎች</option>'+opts;$('attClass').value='__ALL__';$('reportStudent').innerHTML='<option value="__ALL__">ሁሉም ተማሪዎች</option>'+students.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}
function renderStudents(){let q=$('studentSearch').value.toLowerCase();let list=students.filter(s=>[s.name,s.phone,s.className].some(x=>String(x||'').toLowerCase().includes(q)));$('studentsTable').innerHTML='<table><tr><th>ስም</th><th>ክፍል</th><th>ስልክ</th><th></th></tr>'+list.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.className)}</td><td>${esc(s.phone||'')}</td><td>${role==='supervisor'?`<button data-delete-student="${esc(s.id)}">ሰርዝ</button>`:''}</td></tr>`).join('')+'</table>'}
function renderClasses(){$('classesTable').innerHTML='<table><tr><th>ክፍል</th><th>ተማሪዎች</th><th></th></tr>'+classes.map(c=>`<tr><td>${esc(c)}</td><td>${students.filter(s=>s.className===c).length}</td><td>${role==='supervisor'?`<button data-delete-class="${esc(c)}">ሰርዝ</button>`:''}</td></tr>`).join('')+'</table>'}
function drawAttendance(){let iso=dateISO($('attDate').value);if(!iso){$('attendanceTable').innerHTML='<p>ትክክለኛ የኢትዮጵያ ቀን ያስገቡ።</p>';return}let c=$('attClass').value,list=students.filter(s=>c==='__ALL__'||s.className===c),day=attendance[iso]||{};$('attendanceTable').innerHTML=`<p>ቀን: ${dateET(iso)} | ተማሪዎች: ${list.length}</p><table><tr><th>ስም</th><th>P</th><th>A</th><th>L</th><th>E</th></tr>${list.map(s=>`<tr><td>${esc(s.name)}</td>${['P','A','L','E'].map(st=>`<td class="status ${st}"><input type="radio" name="st-${esc(s.id)}" value="${st}" ${day[s.id]===st?'checked':''}></td>`).join('')}</tr>`).join('')}</table>`}
function renderStats(){let c={P:0,A:0,L:0,E:0};Object.values(attendance).forEach(day=>Object.values(day).forEach(v=>{if(c[v]!==undefined)c[v]++}));$('statistics').innerHTML=`<div class="grid">${Object.keys(c).map(k=>`<div class="stat"><b>${c[k]}</b>${k} - ${labels[k]}</div>`).join('')}</div>`}
function report(){let from=dateISO($('fromDate').value),to=dateISO($('toDate').value);if(!from||!to||from>to){$('reportResult').innerHTML='<p class="notice">የቀን ክልሉን ያስተካክሉ።</p>';return}let dates=Object.keys(attendance).filter(d=>d>=from&&d<=to).sort(),sid=$('reportStudent').value,list=students.filter(s=>sid==='__ALL__'||String(s.id)===sid);$('reportResult').innerHTML='<p>ከ '+dateET(from)+' እስከ '+dateET(to)+'</p><table><tr><th>ስም</th><th>ክፍል</th><th>P</th><th>A</th><th>L</th><th>E</th></tr>'+list.map(s=>{let c={P:0,A:0,L:0,E:0};dates.forEach(d=>{let v=attendance[d]?.[s.id];if(c[v]!==undefined)c[v]++});return `<tr><td>${esc(s.name)}</td><td>${esc(s.className)}</td><td>${c.P}</td><td>${c.A}</td><td>${c.L}</td><td>${c.E}</td></tr>`}).join('')+'</table>'}
function renderAll(){fillSelects();renderStudents();renderClasses();drawAttendance();renderStats()}
$('attDate').value=today();$('fromDate').value=today();$('toDate').value=today();
document.querySelectorAll('nav button[data-page]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));$(b.dataset.page).classList.remove('hidden')}));
$('loadAtt').onclick=drawAttendance;$('attClass').onchange=drawAttendance;$('studentSearch').oninput=renderStudents;$('allPresent').onclick=()=>document.querySelectorAll('#attendanceTable input[value=P]').forEach(x=>x.checked=true);
$('saveAtt').onclick=async()=>{if(!currentUser)return alert('መጀመሪያ Sign In ያድርጉ።');let iso=dateISO($('attDate').value);if(!iso)return alert('ትክክለኛ ቀን ያስገቡ።');let day=attendance[iso]||{};document.querySelectorAll('#attendanceTable input:checked').forEach(x=>day[x.name.slice(3)]=x.value);attendance[iso]=day;await cloudSave();saveLocal();renderStats();alert('ቀረቤታው ተቀምጧል።')};
$('addStudent').onclick=async()=>{if(role!=='supervisor')return alert('Supervisor ብቻ ነው።');let name=$('studentName').value.trim();if(!name)return alert('ስም ያስገቡ።');students.push({id:'s'+Date.now(),name,className:$('studentClass').value,phone:$('studentPhone').value.trim()});await cloudSave();saveLocal();$('studentName').value='';$('studentPhone').value='';renderAll()};
$('addClass').onclick=async()=>{if(role!=='supervisor')return alert('Supervisor ብቻ ነው።');let c=$('className').value.trim();if(!c||classes.includes(c))return alert('የክፍል ስም ያስገቡ፤ እንደገና ያለ ክፍል አይጨምሩ።');classes.push(c);await cloudSave();saveLocal();$('className').value='';renderAll()};
document.addEventListener('click',async e=>{if(e.target.dataset.deleteStudent){if(role!=='supervisor')return;students=students.filter(s=>String(s.id)!==e.target.dataset.deleteStudent);Object.values(attendance).forEach(d=>delete d[e.target.dataset.deleteStudent]);await cloudSave();saveLocal();renderAll()}if(e.target.dataset.deleteClass){if(role!=='supervisor')return;let c=e.target.dataset.deleteClass;if(students.some(s=>s.className===c))return alert('በዚህ ክፍል ተማሪ አለ።');classes=classes.filter(x=>x!==c);await cloudSave();saveLocal();renderAll()}});
$('makeReport').onclick=report;$('printReport').onclick=()=>window.print();
function download(name,text){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('backupBtn').onclick=()=>download('sunday-school-backup.json',JSON.stringify({students,classes,attendance},null,2));
$('restoreFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.students)||!Array.isArray(d.classes)||!d.attendance)throw Error();students=d.students;classes=d.classes;attendance=d.attendance;await cloudSave();saveLocal();renderAll();$('backupMessage').textContent='Restore ተሳክቷል።'}catch(err){$('backupMessage').textContent='የBackup ፋይሉ ትክክል አይደለም።'}};
renderAll();setLogin(true);
})();
</script></body></html>
