<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ሰንበት ትምህርት ቤት - Attendance</title>

<style>
:root {
  --green:#167a45;
  --blue:#1769aa;
  --red:#b42318;
  --bg:#f4f7f5;
  --ink:#182522;
  --line:#d8e2dc;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Arial,"Noto Sans Ethiopic",sans-serif;
  font-size:15px;
}

header {
  background:var(--green);
  color:white;
  padding:18px 14px;
  text-align:center;
}

header h1 { margin:0 0 6px; font-size:23px; }
header p { margin:0; font-size:13px; }

nav {
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  justify-content:center;
  background:#fff;
  padding:10px;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:2;
}

button,.btn {
  border:0;
  border-radius:8px;
  padding:10px 13px;
  background:var(--green);
  color:#fff;
  font-weight:700;
  cursor:pointer;
  font-size:14px;
}

nav button { background:#e8f1eb; color:#174d32; }
nav button.active { background:var(--green); color:white; }

main { max-width:1100px; margin:auto; padding:14px; }

.panel {
  background:white;
  border:1px solid var(--line);
  border-radius:12px;
  padding:15px;
  margin-bottom:14px;
}

h2 { font-size:19px; margin:0 0 12px; color:var(--green); }
h3 { margin:10px 0; }

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:10px;
}

label { display:block; font-weight:700; margin-bottom:5px; }

input,select {
  width:100%;
  padding:10px;
  border:1px solid #bac9c0;
  border-radius:7px;
  background:#fff;
  font-size:16px;
}

.row {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  margin-top:10px;
}

.row button { margin:2px; }

table {
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th,td {
  padding:9px 7px;
  border:1px solid var(--line);
  text-align:left;
}

th { background:#edf4ef; }
.table-wrap { overflow-x:auto; }

.status {
  font-weight:800;
  font-size:17px;
  text-align:center;
  min-width:55px;
}

.P { color:#16803d; }
.A { color:#c62828; }
.L { color:#1769aa; }
.E { color:#8657a8; }

.small { font-size:13px; color:#53635b; }
.hidden { display:none!important; }
.notice { padding:10px; border-radius:8px; background:#fff7dc; margin:10px 0; }
.danger { background:var(--red); }
.secondary { background:var(--blue); }
.light { background:#eaf0ec; color:#163c29; }
.stat { padding:12px; background:#edf5ef; border-radius:9px; text-align:center; }
.stat b { display:block; font-size:24px; color:var(--green); }

@media print {
  nav,.no-print,button { display:none!important; }
  body { background:white; font-size:12px; }
  main { max-width:none; padding:0; }
  .panel { border:0; padding:4px; margin:0; }
  header { background:white; color:black; border-bottom:1px solid #333; }
  .table-wrap { overflow:visible; }
  table { font-size:11px; }
  th,td { padding:5px; }
}
</style>
</head>

<body>

<header>
  <h1>ሰንበት ትምህርት ቤት</h1>
  <p>የተማሪ መዝገብ • የቀረቤታ መዝገብ • ሪፖርት</p>
</header>

<nav class="no-print">
  <button class="active" data-page="attendance">ቀረቤታ</button>
  <button data-page="students">ተማሪዎች</button>
  <button data-page="classes">ክፍሎች</button>
  <button data-page="reports">ሪፖርት</button>
  <button data-page="backup">Backup / Restore</button>
</nav>

<main>

<section id="attendance" class="page">
  <div class="panel">
    <h2>የቀረቤታ መዝገብ</h2>

    <div class="grid">
      <div>
        <label for="attDate">ቀን (የኢትዮጵያ ዘመን፦ ቀን/ወር/ዓመት)</label>
        <input id="attDate" placeholder="01/02/2019">
        <div class="small">ለምሳሌ፦ 01/02/2019</div>
      </div>

      <div>
        <label for="attClass">ክፍል</label>
        <select id="attClass"></select>
      </div>
    </div>

    <div class="row">
      <button id="loadAtt">ተማሪዎችን አሳይ</button>
      <button id="saveAtt">ቀረቤታ አስቀምጥ</button>
      <button class="light" id="allPresent">ሁሉንም P አድርግ</button>
    </div>

    <div class="notice">
      P = ተገኝቷል • A = ቀርቷል • L = ዘግይቷል • E = ፈቃድ
    </div>

    <div id="attendanceTable" class="table-wrap"></div>
  </div>
</section>

<section id="students" class="page hidden">
  <div class="panel">
    <h2>ተማሪ መመዝገብ</h2>

    <div class="grid">
      <div>
        <label>ሙሉ ስም</label>
        <input id="studentName" placeholder="የተማሪው ስም">
      </div>

      <div>
        <label>የክፍል ምድብ</label>
        <select id="studentClass"></select>
      </div>

      <div>
        <label>ስልክ (አማራጭ)</label>
        <input id="studentPhone" placeholder="09...">
      </div>
    </div>

    <div class="row">
      <button id="addStudent">ተማሪ ጨምር</button>
    </div>

    <div id="studentsTable" class="table-wrap"></div>
  </div>
</section>

<section id="classes" class="page hidden">
  <div class="panel">
    <h2>ክፍሎች</h2>

    <div class="grid">
      <div>
        <label>የክፍል ስም</label>
        <input id="className" placeholder="ለምሳሌ አንደኛ ክፍል">
      </div>
    </div>

    <div class="row">
      <button id="addClass">ክፍል ጨምር</button>
    </div>

    <div id="classesTable" class="table-wrap"></div>
  </div>
</section>

<section id="reports" class="page hidden">
  <div class="panel">
    <h2>የወር / የቀን ክልል ሪፖርት</h2>

    <div class="grid">
      <div>
        <label>ከ (የኢትዮጵያ ቀን)</label>
        <input id="fromDate" placeholder="01/01/2019">
      </div>

      <div>
        <label>እስከ (የኢትዮጵያ ቀን)</label>
        <input id="toDate" placeholder="30/13/2019">
      </div>

      <div>
        <label>የተማሪ ሪፖርት</label>
        <select id="reportStudent"></select>
      </div>
    </div>

    <div class="row">
      <button id="makeReport">ሪፖርት አውጣ</button>
      <button class="secondary" id="printReport">Print / PDF</button>
      <button class="light" id="csvReport">CSV አውርድ</button>
    </div>

    <div id="reportResult"></div>
  </div>
</section>

<section id="backup" class="page hidden">
  <div class="panel">
    <h2>Backup / Restore</h2>
    <p>መረጃዎን ለማስቀመጥ Backup ያውርዱ።</p>

    <div class="row">
      <button id="backupBtn">Backup አውርድ</button>
      <label class="btn secondary" for="restoreFile">Restore ፋይል ምረጥ</label>
      <input class="hidden" id="restoreFile" type="file" accept=".json,application/json">
    </div>

    <div id="backupMessage" aria-live="polite"></div>
  </div>

  <div class="panel">
    <h2>የመቆለፊያ ቁልፍ</h2>

    <label>አዲስ የይለፍ ቃል</label>
    <input id="newPassword" type="password" placeholder="ቢያንስ 4 ቁምፊ">

    <div class="row">
      <button id="setPassword">የይለፍ ቃል አስቀምጥ</button>
      <button id="lockNow" class="danger">መተግበሪያውን ቆልፍ</button>
    </div>
  </div>
</section>

</main>

<div id="lockScreen" class="hidden"
style="position:fixed;inset:0;background:#f4f7f5;z-index:10;align-items:center;justify-content:center;padding:20px">

  <div class="panel" style="width:min(400px,100%)">
    <h2>መተግበሪያው ተቆልፏል</h2>
    <label>የይለፍ ቃል</label>
    <input id="unlockPassword" type="password">
    <div class="row">
      <button id="unlockBtn">ክፈት</button>
    </div>
    <p id="unlockMessage"></p>
  </div>
</div>

<script>
(function(){
'use strict';

const K = {
  students:'ss_students',
  attendance:'ss_attendance',
  classes:'ss_classes',
  password:'ss_admin_password_hash'
};

const $ = id => document.getElementById(id);

const read = (key,def) => {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : def;
  } catch(e) {
    return def;
  }
};

const write = (key,val) =>
  localStorage.setItem(key,JSON.stringify(val));

let students = read(K.students,[]);
let attendance = read(K.attendance,{});
let classes = read(K.classes,[]);

if(!Array.isArray(students)) students=[];
if(!attendance || typeof attendance!=='object') attendance={};
if(!Array.isArray(classes)) classes=[];

if(!classes.length){
  classes=['አጠቃላይ'];
  write(K.classes,classes);
}

const statusLabels = {
  P:'ተገኝቷል',
  A:'ቀርቷል',
  L:'ዘግይቷል',
  E:'ፈቃድ'
};

function esc(s){
  return String(s??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function saveAll(){
  write(K.students,students);
  write(K.attendance,attendance);
  write(K.classes,classes);
}

/* የኢትዮጵያ ቀን መቀየሪያ */
function ethiopianParts(date){
  try {
    const f = new Intl.DateTimeFormat(
      'en-u-ca-ethiopic',
      {
        day:'numeric',
        month:'numeric',
        year:'numeric',
        timeZone:'UTC'
      }
    );

    const p={};

    f.formatToParts(date).forEach(x=>{
      if(x.type!=='literal') p[x.type]=Number(x.value);
    });

    return {d:p.day,m:p.month,y:p.year};
  } catch(e) {
    return null;
  }
}

function toISO(input){
  const m=String(input||'').trim()
    .match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);

  if(!m) return null;

  const d=+m[1], mo=+m[2], y=+m[3];

  if(d<1 || d>30 || mo<1 || mo>13 || y<1) return null;

  const start=Date.UTC(y+7,7,25);
  const end=Date.UTC(y+8,9,10);

  for(let t=start;t<=end;t+=86400000){
    const p=ethiopianParts(new Date(t));

    if(p && p.y===y && p.m===mo && p.d===d){
      return new Date(t).toISOString().slice(0,10);
    }
  }

  return null;
}

function etDate(iso){
  if(!iso) return '';

  const p=iso.split('-').map(Number);

  const q=ethiopianParts(
    new Date(Date.UTC(p[0],p[1]-1,p[2]))
  );

  return q
    ? `${String(q.d).padStart(2,'0')}/${String(q.m).padStart(2,'0')}/${q.y}`
    : iso;
}

function todayEt(){
  return etDate(new Date().toISOString().slice(0,10));
}

function fillClassSelects(){
  ['attClass','studentClass'].forEach(id=>{
    $(id).innerHTML=classes.map(c=>
      `<option value="${esc(c)}">${esc(c)}</option>`
    ).join('');
  });

  $('attClass').insertAdjacentHTML(
    'afterbegin',
    '<option value="__ALL__">ሁሉም ክፍሎች</option>'
  );

  $('attClass').value='__ALL__';
}

function fillReportStudents(){
  $('reportStudent').innerHTML =
    '<option value="__ALL__">ሁሉም ተማሪዎች</option>' +
    students.map(s=>
      `<option value="${esc(s.id)}">${esc(s.name)}</option>`
    ).join('');
}

function showStudents(){
  $('studentsTable').innerHTML =
    '<table><thead><tr>' +
    '<th>#</th><th>ሙሉ ስም</th><th>ክፍል</th>' +
    '<th>ስልክ</th><th class="no-print">ሰርዝ</th>' +
    '</tr></thead><tbody>' +

    students.map((s,i)=>`
      <tr>
        <td>${i+1}</td>
        <td>${esc(s.name)}</td>
        <td>${esc(s.className||'')}</td>
        <td>${esc(s.phone||'')}</td>
        <td class="no-print">
          <button class="danger" data-del-student="${esc(s.id)}">ሰርዝ</button>
        </td>
      </tr>
    `).join('') +

    '</tbody></table>';

  fillReportStudents();
}

function showClasses(){
  $('classesTable').innerHTML =
    '<table><thead><tr><th>የክፍል ስም</th>' +
    '<th>ተማሪዎች</th><th>ሰርዝ</th></tr></thead><tbody>' +

    classes.map(c=>`
      <tr>
        <td>${esc(c)}</td>
        <td>${students.filter(s=>s.className===c).length}</td>
        <td><button class="danger" data-del-class="${esc(c)}">ሰርዝ</button></td>
      </tr>
    `).join('') +

    '</tbody></table>';
}

function drawAttendance(){
  const iso=toISO($('attDate').value);

  if(!iso){
    $('attendanceTable').innerHTML=
      '<p class="small">ትክክለኛ የኢትዮጵያ ቀን ያስገቡ።</p>';
    return;
  }

  const cl=$('attClass').value;

  const list=students.filter(s=>
    cl==='__ALL__' || s.className===cl
  );

  const day=attendance[iso]||{};

  $('attendanceTable').innerHTML =
    `<p><b>ቀን፦ ${etDate(iso)}</b> | ተማሪዎች፦ ${list.length}</p>` +

    '<table><thead><tr><th>#</th><th>ሙሉ ስም</th><th>ክፍል</th>' +
    '<th>P</th><th>A</th><th>L</th><th>E</th></tr></thead><tbody>' +

    list.map((s,i)=>`
      <tr>
        <td>${i+1}</td>
        <td>${esc(s.name)}</td>
        <td>${esc(s.className||'')}</td>

        ${['P','A','L','E'].map(st=>`
          <td class="status ${st}">
            <input
              aria-label="${esc(s.name)} ${st}"
              type="radio"
              name="status-${esc(s.id)}"
              value="${st}"
              ${day[s.id]===st?'checked':''}
            >
          </td>
        `).join('')}
      </tr>
    `).join('') +

    '</tbody></table>';
}

/* የሪፖርት ማውጫ */
function report(){
  const from=toISO($('fromDate').value);
  const to=toISO($('toDate').value);

  if(!from || !to || from>to){
    $('reportResult').innerHTML=
      '<p class="notice">ትክክለኛ የመጀመሪያና የመጨረሻ ቀን ያስገቡ።</p>';
    return;
  }

  /* ቀረቤታ የተመዘገበባቸውን ቀናት ብቻ እንቆጥራለን */
  const dates=Object.keys(attendance)
    .filter(d=>
      d>=from &&
      d<=to &&
      attendance[d] &&
      Object.keys(attendance[d]).length
    )
    .sort();

  const sid=$('reportStudent').value;

  const list=students.filter(s=>
    sid==='__ALL__' || String(s.id)===sid
  );

  let html=`
    <div class="grid">
      <div class="stat">
        <b>${dates.length}</b>
        የቀረቤታ መዝገብ ያላቸው ቀናት
      </div>

      <div class="stat">
        <b>${list.length}</b>
        ተማሪዎች
      </div>
    </div>

    <p>
      ከ ${etDate(from)} እስከ ${etDate(to)}.
      የተመዘገቡ የቀረቤታ ቀናት ብቻ ይቆጠራሉ።
    </p>
  `;

  const totals={P:0,A:0,L:0,E:0};

  html += `
    <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ተማሪ</th>
          <th>ክፍል</th>
          <th>P - ተገኝቷል</th>
          <th>A - ቀርቷል</th>
          <th>L - ዘግይቷል</th>
          <th>E - ፈቃድ</th>
          <th>ተሳትፎ %</th>
        </tr>
      </thead>
      <tbody>
  `;

  list.forEach(s=>{
    const counts={P:0,A:0,L:0,E:0};

    dates.forEach(d=>{
      const v=attendance[d]?.[s.id];
      if(counts[v]!==undefined) counts[v]++;
    });

    Object.keys(totals).forEach(k=>{
      totals[k]+=counts[k];
    });

    const marked=Object.values(counts)
      .reduce((a,b)=>a+b,0);

    const pct=marked
      ? Math.round((counts.P+counts.L)/marked*100)
      : 0;

    html+=`
      <tr>
        <td>${esc(s.name)}</td>
        <td>${esc(s.className||'')}</td>
        <td>${counts.P}</td>
        <td>${counts.A}</td>
        <td>${counts.L}</td>
        <td>${counts.E}</td>
        <td>${pct}%</td>
      </tr>
    `;
  });

  html += '</tbody></table></div>';

  /* የሁሉም ተማሪዎች ጠቅላላ ውጤት */
  html += `
    <h3>የሁሉም ተማሪዎች ጠቅላላ ውጤት</h3>
    <div class="table-wrap">
    <table>
      <thead>
        <tr><th>ሁኔታ</th><th>ጠቅላላ ቁጥር</th></tr>
      </thead>
      <tbody>
  `;

  Object.keys(totals).forEach(k=>{
    html+=`
      <tr>
        <td class="${k}">${k} - ${statusLabels[k]}</td>
        <td>${totals[k]}</td>
      </tr>
    `;
  });

  html += `
      <tr>
        <th>ጠቅላላ የተመዘገቡ ሁኔታዎች</th>
        <th>${Object.values(totals).reduce((a,b)=>a+b,0)}</th>
      </tr>
      </tbody>
    </table>
    </div>
  `;

  /* አንድ ተማሪ ሲመረጥ የዕለት ዝርዝር */
  if(sid!=='__ALL__'){
    const s=list[0];

    html+=`
      <h3>የዕለት ዝርዝር፦ ${esc(s?.name||'')}</h3>
      <div class="table-wrap">
      <table>
        <thead><tr><th>ቀን (ኢትዮጵያ)</th><th>ሁኔታ</th></tr></thead>
        <tbody>
    `;

    dates.forEach(d=>{
      const v=attendance[d]?.[s.id];

      html+=`
        <tr>
          <td>${etDate(d)}</td>
          <td class="${esc(v||'')}">
            ${v ? `${v} - ${statusLabels[v]}` : 'አልተመዘገበም'}
          </td>
        </tr>
      `;
    });

    html+='</tbody></table></div>';
  }

  $('reportResult').innerHTML=html;

  window.lastReportCSV=[
    ['የሪፖርት ጊዜ',`${etDate(from)} - ${etDate(to)}`],
    ['የቀረቤታ ቀናት',dates.length],
    ['ስም','ክፍል','ተገኝቷል','ቀርቷል','ዘግይቷል','ፈቃድ','ተሳትፎ %'],

    ...list.map(s=>{
      const c={P:0,A:0,L:0,E:0};

      dates.forEach(d=>{
        const v=attendance[d]?.[s.id];
        if(c[v]!==undefined) c[v]++;
      });

      const n=Object.values(c).reduce((a,b)=>a+b,0);

      return [
        s.name,
        s.className||'',
        c.P,
        c.A,
        c.L,
        c.E,
        n ? Math.round((c.P+c.L)/n*100) : 0
      ];
    })
  ];
}

/* የመጀመሪያ ቀኖች */
$('attDate').value=todayEt();
$('fromDate').value=todayEt();
$('toDate').value=todayEt();

/* የገጽ መቀየሪያ */
document.querySelectorAll('nav button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('nav button')
      .forEach(x=>x.classList.remove('active'));

/* ክፍል መጨመር */
$('addClass').onclick=()=>{
  const v=$('className').value.trim();

  if(!v) return alert('የክፍል ስም ያስገቡ');
  if(classes.includes(v)) return alert('ይህ ክፍል አስቀድሞ አለ');

  classes.push(v);
  saveAll();

  $('className').value='';

  fillClassSelects();
  showClasses();
};

/* ተማሪ መጨመር */
$('addStudent').onclick=()=>{
  const name=$('studentName').value.trim();

  if(!name) return alert('የተማሪ ስም ያስገቡ');

  students.push({
    id:'s'+Date.now()+Math.random().toString(16).slice(2,6),
    name,
    className:$('studentClass').value,
    phone:$('studentPhone').value.trim()
  });

  saveAll();

  $('studentName').value='';
  $('studentPhone').value='';

  showStudents();
  drawAttendance();
};

/* ተማሪ ወይም ክፍል መሰረዝ */
document.addEventListener('click',e=>{
  const sd=e.target.dataset.delStudent;
  const cd=e.target.dataset.delClass;

  if(sd && confirm('ይህን ተማሪ ከመዝገብ ልሰርዝ?')){
    students=students.filter(s=>String(s.id)!==sd);

    Object.values(attendance).forEach(d=>delete d[sd]);

    saveAll();
    showStudents();
    drawAttendance();
  }

  if(cd){
    if(students.some(s=>s.className===cd)){
      return alert('በዚህ ክፍል ተማሪ አለ። መጀመሪያ ተማሪዎቹን ወደ ሌላ ክፍል ያዛውሩ።');
    }

    if(confirm('ክፍሉን ልሰርዝ?')){
      classes=classes.filter(c=>c!==cd);

      saveAll();
      fillClassSelects();
      showClasses();
    }
  }
});

/* ቀረቤታ */
$('loadAtt').onclick=drawAttendance;

$('allPresent').onclick=()=>{
  document.querySelectorAll(
    '#attendanceTable input[type=radio][value=P]'
  ).forEach(x=>x.checked=true);
};

$('saveAtt').onclick=()=>{
  const iso=toISO($('attDate').value);

  if(!iso) return alert('ቀኑን በትክክል ያስገቡ');

  const day=attendance[iso]||{};

  document.querySelectorAll(
    '#attendanceTable input[type=radio]:checked'
  ).forEach(x=>{
    const id=x.name.slice(7);
    day[id]=x.value;
  });

  attendance[iso]=day;
  saveAll();

  alert('ቀረቤታው ተቀምጧል።');
};

/* ሪፖርት */
$('makeReport').onclick=report;

$('printReport').onclick=()=>{
  if(!$('reportResult').innerHTML) report();
  window.print();
};

/* CSV ማውረድ */
$('csvReport').onclick=()=>{
  if(!window.lastReportCSV) report();
  if(!window.lastReportCSV) return;

  const csv=window.lastReportCSV.map(row=>
    row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')
  ).join('\r\n');

  const blob=new Blob(
    ['\ufeff'+csv],
    {type:'text/csv;charset=utf-8;'}
  );

  downloadBlob(blob,'attendance-report.csv');
};

function downloadBlob(blob,name){
  if(window.Android && Android.saveTextFile){
    const r=new FileReader();

    r.onload=()=>{
      Android.saveTextFile(name,r.result,blob.type);
    };

    r.readAsText(blob);
    return;
  }

  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name;
  a.click();

  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* Backup */
$('backupBtn').onclick=()=>{
  const data={
    version:2,
    exportedAt:new Date().toISOString(),
    students,
    attendance,
    classes,
    passwordHash:localStorage.getItem(K.password)||null
  };

  downloadBlob(
    new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),
    'sunday-school-backup.json'
  );

  $('backupMessage').textContent='Backup ፋይል ተዘጋጅቷል።';
};

/* Restore */
$('restoreFile').onchange=async e=>{
  const f=e.target.files[0];
  if(!f) return;

  try {
    const data=JSON.parse(await f.text());

    if(!Array.isArray(data.students) ||
       !data.attendance ||
       !Array.isArray(data.classes)){
      throw new Error('invalid');
    }

    if(!confirm('የአሁኑን መረጃ በBackup መረጃ መተካት ይፈልጋሉ? ከመጀመሪያ Backup ያውርዱ።')){
      return;
    }

    students=data.students;
    attendance=data.attendance;
    classes=data.classes;

    saveAll();

    if(data.passwordHash){
      localStorage.setItem(K.password,data.passwordHash);
    }

    fillClassSelects();
    showStudents();
    showClasses();
    drawAttendance();

    $('backupMessage').textContent='Restore ተሳክቷል።';

  } catch(err) {
    $('backupMessage').textContent='ፋይሉ ትክክለኛ Backup አይደለም።';
  }
};

/* የይለፍ ቃል */
async function hash(text){
  if(crypto && crypto.subtle){
    const b=await crypto.subtle.digest(
      'SHA-256',
      new TextEncoder().encode(text)
    );

    return Array.from(new Uint8Array(b))
      .map(x=>x.toString(16).padStart(2,'0'))
      .join('');
  }

  return 'plain:'+text;
}

$('setPassword').onclick=async()=>{
  const p=$('newPassword').value;

  if(p.length<4){
    return alert('የይለፍ ቃሉ ቢያንስ 4 ቁምፊ ይሁን');
  }

  localStorage.setItem(K.password,await hash(p));
  $('newPassword').value='';

  alert('የይለፍ ቃሉ ተቀምጧል።');
};

$('lockNow').onclick=()=>{
  if(!localStorage.getItem(K.password)){
    return alert('መጀመሪያ የይለፍ ቃል ያዘጋጁ።');
  }

  $('lockScreen').classList.remove('hidden');
  $('lockScreen').style.display='flex';
};

$('unlockBtn').onclick=async()=>{
  const saved=localStorage.getItem(K.password);
  const entered=$('unlockPassword').value;
  const hashed=await hash(entered);

  if(saved===hashed || saved==='plain:'+entered){
    $('lockScreen').style.display='none';
    $('lockScreen').classList.add('hidden');
    $('unlockPassword').value='';
    $('unlockMessage').textContent='';
  } else {
    $('unlockMessage').textContent='የይለፍ ቃሉ ትክክል አይደለም።';
  }
};

/* መጀመሪያ ሲከፈት */
fillClassSelects();
showStudents();
showClasses();
fillReportStudents();
drawAttendance();

})();
